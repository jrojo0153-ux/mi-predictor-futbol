name: Pipeline de Prediccion de Futbol Autonomo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # <--- IMPORTANTE: Habilita el botón manual "Run workflow" en la web de GitHub

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código fuente del repositorio dentro del contenedor virtual
    - name: Clonar repositorio
      uses: actions/checkout@v4

    # 2. Configurar la versión nativa de Python
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Instalar dependencias aisladas de análisis de datos
    - name: Instalar librerías de Machine Learning
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Correr la lógica predictiva
    - name: Ejecutar script predictor.py
      run: |
        python predictor.py

    # 5. Guardar los resultados generados y subirlos automáticamente al repositorio
    - name: Persistir reporte de predicciones
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add predicciones_reporte.txt
        # Control de excepciones: evita fallas si las predicciones arrojan exactamente el mismo resultado
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto: Actualización de predicciones del sistema"
        git push
