name: Pipeline de Prediccion de Futbol Autonomo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Habilita de manera forzada el inicio por botón manual desde la interfaz de GitHub

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    # 1. Mapea y descarga tu repositorio dentro de la máquina virtual de Ubuntu
    - name: Clonar repositorio
      uses: actions/checkout@v4

    # 2. Prepara el compilador de Python
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Instala los requerimientos definidos
    - name: Instalar librerías de Machine Learning
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Enlaza el Secret de GitHub con el ambiente de Python y corre la inferencia
    - name: Ejecutar script predictor.py con APIs
      env:
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      run: |
        python predictor.py

    # 5. Realiza un commit automático si los datos en el reporte cambiaron
    - name: Persistir reporte de predicciones
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add predicciones_reporte.txt
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto: Actualización de predicciones con cuotas en vivo"
        git push
