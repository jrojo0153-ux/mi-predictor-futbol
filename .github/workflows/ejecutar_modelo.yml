name: Pipeline de Prediccion de Futbol Autonomo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerías de Machine Learning
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar script predictor.py con APIs y MLOps
      env:
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      run: |
        python predictor.py

    # Persiste los tres archivos del ecosistema sin borrar ninguno
    - name: Guardar Reporte, Dataset y Log de Métricas
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add predicciones_reporte.txt dataset_historico.csv metricas_rendimiento.csv
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto: Sincronización del reporte diario, datos de ESPN y métricas de error"
        git push
